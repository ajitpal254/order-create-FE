# Netlify Build and Deployment Configuration for Vite SPA
[build]
  publish = "dist"
  command = "npm run build"

# Cache headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Proxy /api requests directly to Render Live Backend API
[[redirects]]
  from = "/api/*"
  to = "https://order-creator-be.onrender.com/api/:splat"
  status = 200
  force = true

# SPA Fallback rule so React Router handles deep routes (/order-creator, /catalog, /admin, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
